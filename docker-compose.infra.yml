# Local dev infrastructure only — no application image.
# Bring these up first so you can run the Spring Boot app from your IDE or
# `./mvnw spring-boot:run` while pointing at localhost.
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml ps
#   docker compose -f docker-compose.infra.yml down          # keep volumes
#   docker compose -f docker-compose.infra.yml down -v       # nuke data
#
# Endpoints (defaults expected by src/main/resources/application.yml):
#   Qdrant REST  http://localhost:6333
#   Qdrant gRPC  localhost:6334
#   Qdrant UI    http://localhost:6333/dashboard
#   Neo4j Bolt   bolt://localhost:7687
#   Neo4j UI     http://localhost:7474  (user: neo4j / pass: guardianpass)

name: guardian-infra

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: guardian-qdrant
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant image ships with bash; use /dev/tcp probe to avoid extra tools.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.24
    container_name: guardian-neo4j
    environment:
      NEO4J_AUTH: neo4j/guardianpass
      # Conservative memory settings for a laptop.
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # cypher-shell is bundled in the image — cheapest reliable readiness probe.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p guardianpass 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant-data:
  neo4j-data:
  neo4j-logs:

